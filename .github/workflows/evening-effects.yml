name: Evening effects

on:
  schedule:
    # Every 15 minutes from 4pm to midnight Pacific in winter and 5pm to 1am in summer, so the
    # effect starts soon after sunset. A run plays for up to an hour while the lights are on,
    # the next one waits its turn, and runs outside sunset to midnight stop right away.
    - cron: "*/15 0-7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the first steps, without changing the lights"
        type: boolean
        default: true

permissions:
  contents: read

# A run that starts while the effect is playing waits its turn, so two never play at once
concurrency:
  group: evening-effects
  cancel-in-progress: false

jobs:
  effect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Play the effect
        run: python3 -u daily_show.py --animate ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
